name: Verify main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencia del parser
        run: python -m pip install openpyxl==3.1.5
      - name: Verificar runner sin red corporativa
        run: python scripts/test_bot_control.py
      - name: Ejecutar verificaciones y build
        run: npm run build
