name: Deploy Myke Edge
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myke-edge-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Recuperar configuración pública del proyecto existente
        run: node scripts/extract-public-pages-env.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Desplegar Myke y validar CORS sin llamadas al LLM
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/activate-myke.mjs
